apply plugin: 'com.android.application'

configurations { natives }
def arcore_libpath = "../../arcore"

android {
    compileSdk = 34
    defaultConfig {
        applicationId = "com.lvonasek.arcore3dscanner.remix"
        namespace ="com.lvonasek.arcore3dscanner"
        minSdkVersion 24
        targetSdkVersion 34
        manifestPlaceholders = ['appAuthRedirectScheme': 'https://lvonasek.github.io/redirect.html']
        multiDexEnabled true
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures {
            buildConfig true
            viewBinding true
        }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += '../../common/ar/'
        main.java.srcDirs += '../../common/record/'
        main.java.srcDirs += '../../common/utils/'
    }
    ndkVersion '25.1.8937393'
}

dependencies {
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    
    // ARCore 1.52.0 - Latest version with bug fixes and performance improvements
    implementation 'com.google.ar:core:1.52.0'
    natives 'com.google.ar:core:1.52.0'
    
    // Huawei AR Engine 3.7.0.3 - Latest stable for HMS devices
    // Supports: Depth API, improved face tracking, better environmental understanding
    // Compatible with: P30 Pro, Mate 30/40 series, etc.
    implementation 'com.huawei.hms:arenginesdk:3.7.0.3'
    
    // Google VR SDK for Cardboard/Daydream support
    implementation files('src/main/libs/sdk-base-1.190.0.aar')
    
    // OAuth for Sketchfab integration
    implementation 'net.openid:appauth:0.11.1'

    // Video encoding
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'org.jcodec:jcodec-android:0.2.5'
    
    // Server streaming (WebSocket + MessagePack + LZ4)
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    implementation 'org.msgpack:msgpack-core:0.9.3'
    implementation 'org.lz4:lz4-java:1.8.0'
}

task extractNativeLibraries() {
    // Always extract, this insures the native libs are updated if the version changes.
    outputs.upToDateWhen { false }
    doFirst {
        configurations.natives.files.each { f ->
            copy {
                from zipTree(f)
                into arcore_libpath
                include "jni/**/*"
            }
        }
    }
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.whenTaskAdded {
    task-> if (task.name.contains("external") && !task.name.contains("Clean")) {
        task.dependsOn(extractNativeLibraries)
    }
}
